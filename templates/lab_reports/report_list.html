{% extends "base.html" %}

{% block title %}Lab Reports{% endblock %}

{% block content %}

<h2>Lab Reports</h2>

{% for report in reports %}

<div>

<h4>{{ report.report_name }}</h4>

<p>{{ report.appointment.patient.username }}</p>

<a href="{{ report.report_file.url }}">
    Download
</a>

<hr>

</div>

{% empty %}

<p>No reports available.</p>

{% endfor %}

{% endblock %}
